# Dołącz ten fragment w konfiguracji serwera Nginx dla Spotykaj.
# Chroni pliki sekretów, backupy, logi i repozytorium Git.

location ~ (^|/)(\.env|\.git)(/|$) {
    deny all;
    return 404;
}

location ~ ^/(backups|logs)(/|$) {
    deny all;
    return 404;
}

location ~* \.(?:sql|sqlite|db|bak|backup|log|env)$ {
    deny all;
    return 404;
}
